<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventário — Defensoria Pública RS</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
</head>

<body>

<!-- LOGIN -->
<div id="login-container" class="card-login">
  <img src="https://www.defensoria.rs.def.br/themes/modelo-hotsite/images/logos/logo.png" class="logo">
  <h2>Inventário Patrimonial</h2>

  <input id="usuario" class="input-login" placeholder="Usuário">
  <input id="senha" type="password" class="input-login" placeholder="Senha">

  <button class="btn-primary" onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app-container" class="hidden">

  <header>
    <h2 id="titulo-centro"></h2>
    <button onclick="logout()" class="btn-danger-small">Sair</button>
  </header>

  <div id="dashboard"></div>

  <div class="search-box">
    <input id="input-leitura" placeholder="Digite ou escaneie..." autofocus>
    <button id="btn-scanner" class="btn-scan">📷</button>
  </div>

  <div id="tabela-container"></div>

  <button id="btn-exportar" class="btn-primary mt-2">Exportar Excel</button>

</div>

<!-- Scanner modal -->
<div id="scanner-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Leitor de Código de Barras</h3>
    <div id="reader"></div>
    <button onclick="closeScanner()" class="btn-danger mt-2">Fechar</button>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/scanner.js"></script>
<script src="js/storage.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
