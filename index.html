<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sistema de Inventário - DPERS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Ícone do PWA -->
    <link rel="manifest" href="manifest.json" />

</head>
<body>

    <header>
        <h1>Sistema de Inventário</h1>
    </header>

    <main>

        <!-- LOGIN -->
        <section id="login-section">
            <h2>Acesso ao Sistema</h2>

            <input id="login-usuario" type="text" placeholder="Usuário" />
            <input id="login-senha" type="password" placeholder="Senha" />

            <button id="btn-login">Entrar</button>

            <p id="login-erro" class="erro"></p>
        </section>

        <!-- TELA PRINCIPAL -->
        <section id="app-section" style="display:none;">
            
            <div class="top-bar">
                <span id="user-info"></span>
                <button id="btn-sair">Sair</button>
            </div>

            <h2>Inventário</h2>

            <!-- FILTROS -->
            <div class="filtros">
                <label>Centro de Custo:</label>
                <select id="filtro-centro-custo"></select>

                <label>Status:</label>
                <select id="filtro-status">
                    <option value="">Todos</option>
                    <option value="localizado">Localizado</option>
                    <option value="pendente">Pendente</option>
                    <option value="fora_lista">Fora da Lista</option>
                </select>

                <button id="btn-aplicar-filtros">Aplicar</button>
            </div>

            <!-- SCANNER -->
            <button id="btn-scanner">Iniciar Scanner</button>
            <p id="scanner-feedback"></p>

            <!-- LISTA -->
            <table id="tabela-itens">
                <thead>
                    <tr>
                        <th>Patrimônio</th>
                        <th>Descrição</th>
                        <th>Centro de Custo</th>
                        <th>Setor</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo"></tbody>
            </table>

        </section>

    </main>

    <!-- JS -->
    <script>
        /* 🔵 URL fixa do backend no Railway */
        const API_URL = "https://sistema-de-inventario-production-2c46.up.railway.app";
    </script>

    <script src="app.js"></script>

</body>
</html>
